  <footer class="site-footer">
    <p class="fine-print">Past performance is not indicative of future results. But we're feeling good about this one.</p>
    <p class="best-viewed">Best viewed in Netscape Navigator at 800 &times; 600</p>
  </footer>

<script>
(function () {
  var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw1UZDPcTJudpKI3ajLyQqGo8tLjVs2JQqAKRRftUds_navF6399H3Bwd3bM87KVXSQRw/exec';
  var STORE_KEY = 'rsvpParty';
  var OPEN_EVENTS = ['ENG_PARTY', 'COOK_INDY', 'COOK_BOS', 'WED_EXCURSION', 'WED_HANG', 'WED_DAY']; // only these events show on the RSVP page

  var $ = function (id) { return document.getElementById(id); };
  var findForm = $('rsvp-find'), form = $('rsvp-form'), statusEl = $('rsvp-status'),
      picker = $('rsvp-picker'), done = $('rsvp-done');
  var data = null, kidCount = 0;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function say(msg) { statusEl.innerHTML = msg || ''; }
  function store(v) { try { v ? localStorage.setItem(STORE_KEY, v) : localStorage.removeItem(STORE_KEY); } catch (e) {} }
  function stored() { try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; } }

  function api(params) {
    var qs = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
    return fetch(WEB_APP_URL + '?' + qs).then(function (r) { return r.json(); });
  }

  function fmtDate(iso) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return iso || '';
    var p = iso.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  function fullName(m) { return (m.first + ' ' + (m.last || '')).trim(); }

  function oops(msg) {
    var box = $('rsvp-oops');
    $('rsvp-oops-text').textContent = msg;
    if (box && box.parentNode !== document.body) document.body.appendChild(box);
    if (box && box.showModal) { box.showModal(); } else { say(esc(msg)); }
  }
  $('rsvp-oops-close').addEventListener('click', function () {
    $('rsvp-oops').close();
    $('rsvp-q').focus();
  });

  findForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var q = $('rsvp-q').value.trim();
    if (q.length < 3) { oops('Type your full first and last name, or the last 4 digits of your phone.'); return; }
    if (!/^\d+$/.test(q.replace(/[\s()+-]/g, '')) && q.split(/\s+/).length < 2) {
      oops('Add your last name too. Type your first and last name the way they\'d be on your invite (like "Jane Doe"), or the last 4 digits of your phone.');
      return;
    }
    say('Looking you up&hellip;');
    picker.innerHTML = '';
    api({ action: 'lookup', q: q }).then(function (res) {
      say('');
      if (res.error) { oops(res.error); return; }
      if (res.party) { showParty(res.party); return; }
      if (!res.matches.length) {
        oops(/^\d+$/.test(q.replace(/[\s()+-]/g, ''))
          ? "We couldn't find that phone number. Try the last 4 digits of your cell, or your full first and last name. Still stuck? Text Sam or Patrick."
          : "We couldn't find that name. Try your full first and last name the way it's on your invite, or the last 4 digits of your phone. Still stuck? Text Sam or Patrick.");
        return;
      }
      say('A few invites match. Which one is yours?');
      res.matches.forEach(function (m) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'rsvp-pick';
        b.textContent = m.label;
        b.addEventListener('click', function () { loadParty(m.party); });
        picker.appendChild(b);
      });
    }).catch(function () { say(''); oops('Something went wrong on our end. Try again in a minute, or text Sam or Patrick.'); });
  });
  function loadParty(party) {
    say('Loading your invite&hellip;');
    picker.innerHTML = '';
    api({ action: 'party', party: party }).then(function (res) {
      if (res.error) { store(null); findForm.hidden = false; say(''); return; }
      showParty(res);
    }).catch(function () { findForm.hidden = false; say('Something went wrong. Try again in a minute, or text Sam or Patrick.'); });
  }

  function showParty(p) {
    p.events = p.events.filter(function (ev) { return OPEN_EVENTS.indexOf(ev.id) !== -1; });
    data = p;
    kidCount = 0;
    store(p.party);
    say('');
    picker.innerHTML = '';
    findForm.hidden = true;
    done.hidden = true;
    form.hidden = false;
    $('rsvp-party').textContent = p.members.filter(function (m) { return m.first; }).map(fullName).join(', ') || p.party;

    var prior = p.prior || [];
    var yes = {};
    prior.forEach(function (r) { if (r.attending) yes[(r.id || r.name) + '|' + r.event] = true; });
    var hasPrior = prior.length > 0;

    var priorName = {};
    prior.forEach(function (r) { if (r.id) priorName[r.id] = r.name; });

    var people = p.members.map(function (m) {
      return { id: m.id, name: m.first ? fullName(m) : (priorName[m.id] || ''), unnamed: !m.first, type: m.type, events: m.events };
    });

    var addedKids = [];
    prior.forEach(function (r) { if (r.added && addedKids.indexOf(r.name) === -1) addedKids.push(r.name); });

    var box = $('rsvp-events');
    box.innerHTML = '';
    p.events.forEach(function (ev) {
      var who = people.filter(function (x) { return x.events.indexOf(ev.id) !== -1; });
      if (!who.length) return;
      var fs = document.createElement('fieldset');
      fs.className = 'rsvp-event';
      fs.dataset.event = ev.id;
      var meta = [ev.date ? fmtDate(ev.date) : 'Date coming soon', ev.location].filter(Boolean).join(' &middot; ');
      var html = '<legend>' + esc(ev.name) + '</legend><p class="rsvp-meta">' + meta + '</p>';
      if (ev.deadline) {
        html += '<p class="rsvp-deadline">' + (ev.closed ? 'RSVPs closed ' : 'Please RSVP by ') + esc(fmtDate(ev.deadline)) + '</p>';
      }
      if (ev.id === 'ENG_PARTY') {
        html += '<p class="rsvp-weekend">This RSVP is for Saturday\'s party, 4&ndash;8pm. We\'ve got more going on all weekend: comedy Friday night, coffee Saturday morning, and the park on Sunday. No RSVP needed for those. <a href="engagement.html" target="_blank">See the whole weekend</a></p>';
      }
      if (ev.id === 'WED_EXCURSION') {
        html += '<p class="rsvp-weekend">We\'d love you with us Friday and Saturday, September 24 and 25. One day is the trip to &Eacute;vora and the other is the full day wedding celebration. We\'ll share which is which once it\'s set. If anything changes for you, come back and update your RSVP any time. <a href="wedding.html" target="_blank">See the wedding weekend</a></p>';
      }
      var isCook = ev.id === 'COOK_INDY' || ev.id === 'COOK_BOS';
      if (isCook) {
        html += '<p class="rsvp-weekend">No date yet, so this isn\'t a real RSVP. Just tell us who\'d want to come so we know how big a grill to bring.</p>';
      }
      html += '<p class="rsvp-hint">' + (isCook ? 'Check anyone who\'s interested:' : 'Check everyone who\'s coming:') + '</p>';
      who.forEach(function (x) {
        var key = x.id + '|' + ev.id;
        html += '<label><input type="checkbox" data-person="' + esc(x.id) + '"' +
          (yes[key] ? ' checked' : '') + (ev.closed ? ' disabled' : '') + '> ' +
          '<span class="rsvp-name" data-name-for="' + esc(x.id) + '">' + esc(x.name || 'Your guest') + '</span></label>';
      });
      html += '<div class="rsvp-kids"></div>';
      if (ev.kidsWelcome && !ev.weddingOnly && !ev.closed) {
        html += '<button type="button" class="rsvp-addkid">+ Add a kid</button>';
      }
      fs.innerHTML = html;
      box.appendChild(fs);
    });

    var pbox = $('rsvp-people');
    pbox.innerHTML = '';
    var priorDiet = {};
    prior.forEach(function (r) { if (r.dietary) priorDiet[r.id || r.name] = r.dietary; });
    people.forEach(function (x) {
      var row = document.createElement('div');
      row.className = 'rsvp-person';
      row.dataset.person = x.id;
      var html = '';
      if (x.unnamed) {
        html += '<label>Your guest\'s name<input type="text" class="rsvp-guestname" value="' + esc(x.name) + '" placeholder="First and last name"></label>';
      }
      html += '<label>Dietary needs' + (x.unnamed ? '' : ' for ' + esc(x.name)) +
        '<input type="text" class="rsvp-diet" value="' + esc(priorDiet[x.id] || '') + '" placeholder="Allergies, vegetarian, etc."></label>';
      row.innerHTML = html;
      pbox.appendChild(row);
    });

    addedKids.forEach(function (name) { addKid(name, yes, priorDiet[name]); });

    var wed = p.events.some(function (ev) { return ev.weddingOnly; });
    $('rsvp-lodging-box').hidden = !wed;
    var lodging = '';
    prior.forEach(function (r) { if (r.lodging) lodging = r.lodging; });
    Array.prototype.forEach.call(form.querySelectorAll('input[name="lodging"]'), function (r) { r.checked = r.value === lodging; });
    $('rsvp-message').value = prior.length ? prior[0].message : '';
    $('rsvp-submit').textContent = hasPrior ? 'Update my RSVP' : 'Send RSVP';
  }

  function addKid(name, yes, diet) {
    kidCount++;
    var kid = 'kid' + kidCount;
    yes = yes || {};
    Array.prototype.forEach.call(document.querySelectorAll('.rsvp-event'), function (fs) {
      var ev = data.events.filter(function (e) { return e.id === fs.dataset.event; })[0];
      if (!ev || !ev.kidsWelcome || ev.weddingOnly) return;
      var lab = document.createElement('label');
      lab.innerHTML = '<input type="checkbox" data-person="' + kid + '"' +
        (name && yes[name + '|' + ev.id] ? ' checked' : '') + (ev.closed ? ' disabled' : '') +
        '> <span class="rsvp-name" data-name-for="' + kid + '">' + esc(name || 'New kid') + '</span>';
      fs.querySelector('.rsvp-kids').appendChild(lab);
    });
    var row = document.createElement('div');
    row.className = 'rsvp-person rsvp-kid';
    row.dataset.person = kid;
    row.innerHTML = '<label>Kid\'s name<input type="text" class="rsvp-guestname" value="' + esc(name || '') + '" placeholder="First and last name"></label>' +
      '<label>Dietary needs<input type="text" class="rsvp-diet" value="' + esc(diet || '') + '"></label>' +
      '<button type="button" class="rsvp-removekid">Remove</button>';
    $('rsvp-people').appendChild(row);
    if (!name) row.querySelector('.rsvp-guestname').focus();
  }

  form.addEventListener('click', function (e) {
    if (e.target.classList.contains('rsvp-addkid')) { addKid(''); }
    if (e.target.classList.contains('rsvp-removekid')) {
      var id = e.target.parentNode.dataset.person;
      Array.prototype.forEach.call(form.querySelectorAll('[data-person="' + id + '"]'), function (el) {
        (el.tagName === 'INPUT' ? el.parentNode : el).remove();
      });
    }
  });

  form.addEventListener('input', function (e) {
    if (!e.target.classList.contains('rsvp-guestname')) return;
    var id = e.target.closest('.rsvp-person').dataset.person;
    Array.prototype.forEach.call(form.querySelectorAll('[data-name-for="' + id + '"]'), function (s) {
      s.textContent = e.target.value.trim() || (id.indexOf('kid') === 0 ? 'New kid' : 'Your guest');
    });
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var people = [];
    var problem = '';
    Array.prototype.forEach.call(form.querySelectorAll('.rsvp-person'), function (row) {
      var id = row.dataset.person;
      var isKid = id.indexOf('kid') === 0;
      var nameInput = row.querySelector('.rsvp-guestname');
      var member = isKid ? null : data.members.filter(function (m) { return m.id === id; })[0];
      var name = nameInput ? nameInput.value.trim() : fullName(member);
      var attending = [];
      Array.prototype.forEach.call(form.querySelectorAll('input[type="checkbox"][data-person="' + id + '"]'), function (cb) {
        if (cb.checked) attending.push(cb.closest('.rsvp-event').dataset.event);
      });
      (data.prior || []).forEach(function (r) {
        if (!isKid && r.id === id && r.attending && OPEN_EVENTS.indexOf(r.event) === -1 && attending.indexOf(r.event) === -1) attending.push(r.event);
      });
      if (nameInput && !name && attending.length) problem = 'Please add a name for everyone you checked.';
      people.push({ id: isKid ? '' : id, name: name, attending: attending, dietary: row.querySelector('.rsvp-diet').value });
    });
    if (problem) { say(problem); return; }

    var lodgingEl = form.querySelector('input[name="lodging"]:checked');
    var body = {
      party: data.party,
      people: people,
      lodging: lodgingEl ? lodgingEl.value : '',
      answered: OPEN_EVENTS,
      message: $('rsvp-message').value,
    };

    var btn = $('rsvp-submit');
    btn.disabled = true;
    say('Sending&hellip;');
    fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        btn.disabled = false;
        if (!res.ok) { say(esc(res.error || 'Something went wrong. Please try again.')); return; }
        say('');
        form.hidden = true;
        done.hidden = false;
        var coming = people.filter(function (x) { return x.attending.length; }).length;
        $('rsvp-done-text').textContent = coming
          ? "We can't wait to see you. If plans change, come back here and update your answers."
          : "We'll miss you! If plans change, come back here and update your answers.";
        window.scrollTo(0, 0);
      })
      .catch(function () { btn.disabled = false; say('Something went wrong. Please try again, or text Sam or Patrick.'); });
  });

  $('rsvp-switch').addEventListener('click', function (e) {
    e.preventDefault();
    store(null);
    data = null;
    form.hidden = true;
    done.hidden = true;
    findForm.hidden = false;
    $('rsvp-q').value = '';
    $('rsvp-q').focus();
    say('');
  });

  $('rsvp-edit').addEventListener('click', function (e) {
    e.preventDefault();
    if (data) loadParty(data.party);
  });

  var saved = stored();
  if (saved) { findForm.hidden = true; loadParty(saved); }
})();
</script>
</body>
</html>
